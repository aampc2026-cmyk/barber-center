# ============================================================================
# Panel de edición — Barber Center (Sveltia CMS)
# Rellena "repo" con tu-usuario/tu-repositorio de GitHub antes de publicar.
# ============================================================================
backend:
  name: github
  repo: aampc2026-cmyk/barber-center
  branch: main

# Idioma del panel
locale: es

# Carpeta donde se guardan las imágenes que suba el cliente
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "negocio"
    label: "Datos del negocio"
    description: "Información que se muestra en toda la web. Edita y pulsa Guardar."
    files:
      - name: "datos"
        label: "Información general"
        file: "content/datos.json"
        icon: "settings"
        fields:
          - { name: "booksyUrl",     label: "Enlace de reservas (Booksy)",          widget: "string" }
          - { name: "phoneDisplay",  label: "Teléfono (como se ve en la web)",      widget: "string" }
          - { name: "phoneLink",     label: "Teléfono para llamar (sin espacios)",  widget: "string", hint: "Ejemplo: +34922075460" }
          - { name: "instagram",     label: "Usuario de Instagram (sin la @)",      widget: "string" }
          - { name: "address",       label: "Dirección",                            widget: "string" }
          - { name: "city",          label: "Ciudad y código postal",               widget: "string" }
          - { name: "hoursShort",    label: "Horario de apertura",                  widget: "string" }
          - { name: "hoursClosed",   label: "Días de cierre",                       widget: "string" }
          - { name: "booksyRating",  label: "Nota en Booksy",                       widget: "string", hint: "Ejemplo: 5,0" }
          - { name: "booksyReviews", label: "Número de reseñas en Booksy",          widget: "string" }
          - { name: "googleRating",  label: "Nota en Google",                       widget: "string", hint: "Ejemplo: 4,8" }
          - { name: "googleReviews", label: "Número de reseñas en Google",          widget: "string" }
